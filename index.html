<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Note in Gioco</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Il quiz di musica gratis, senza pubblicità e senza registrazione.">
<meta name="theme-color" content="#1F2A2E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: una colonna da telefono (max 440px) centrata, una schermata per volta */
:root {
  --bg: #1F2A2E; --card: #2A373C; --line: #3A494F; --line2: #475960; --line3: #56686F;
  --fg: #FFFFFF; --muted: #C5D0CF; --track: #33434A; --deep: #151D20;
  --accent: #A9C7B0; --accent-d: #6E8F78; --cool: #8FB8B0; --hot: #D9967E; --err: #E3A58C; --gold: #E8C874;
  --ink: #1F2A2E;
  --display: "Oswald", "Arial Narrow", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 14px;
  padding-block: 18px 22px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
.disp { font-family: var(--display); font-weight: 700; text-transform: uppercase; line-height: 1.05; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.iconbtn { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
.btn { height: 52px; border-radius: 14px; border: none; background: var(--accent); color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
.btn.ghost { background: transparent; border: 1px solid var(--line3); color: var(--fg); font-family: var(--body); font-size: 15px; font-weight: 600; letter-spacing: 0; text-transform: none; }
.btn.link { background: transparent; color: var(--accent); height: 44px; font-family: var(--body); font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.btn:active { transform: translateY(1px); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.bar { height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s ease; }
.bar.gold > i { background: linear-gradient(to right, #B8913A, var(--gold)); }
.tab { font-variant-numeric: tabular-nums; }

/* Home */
.hero { position: relative; min-height: 104px; }
.hero .mic { position: absolute; right: -16px; top: -46px; width: 132px; height: 178px; opacity: .85;
  -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 92%); mask-image: linear-gradient(to bottom, #000 45%, transparent 92%); pointer-events: none; }
.hero h1 { position: relative; margin: 0; font-size: 38px; padding-top: 8px; text-shadow: 0 2px 12px var(--bg); max-width: 260px; }
.hero p { position: relative; margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.scalata { position: relative; overflow: hidden; padding: 20px 22px 62px; display: flex; flex-direction: column; gap: 11px; }
.scalata .vinyl { position: absolute; top: -44px; right: -74px; width: 190px; height: 190px; }
.scalata .keys { position: absolute; left: 0; bottom: 0; width: 100%; height: 46px; }
.scalata .btn { height: 50px; margin-top: 2px; }
.scalata > *:not(svg) { position: relative; }
.mode { position: relative; overflow: hidden; height: 150px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); padding: 0 12px 14px; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
.mode svg.inst { position: absolute; top: -6px; right: -44px; width: 190px; height: 131px;
  -webkit-mask-image: linear-gradient(to right, transparent 8%, #000 55%); mask-image: linear-gradient(to right, transparent 8%, #000 55%); }
.mode .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; background: linear-gradient(to top, var(--card) 45%, rgba(42,55,60,0)); }
.mode > span:not(.fade) { position: relative; }
.mode .t { font-family: var(--display); font-weight: 600; font-size: min(19px, 4.7vw); letter-spacing: .3px; text-transform: uppercase; white-space: nowrap; }

/* Gioco */
.qcard { position: relative; overflow: hidden; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 124px; }
.qcard .vin { position: absolute; right: -104px; top: 50%; margin-top: -105px; width: 210px; height: 210px; opacity: .85;
  -webkit-mask-image: linear-gradient(to left, #000 45%, transparent 100%); mask-image: linear-gradient(to left, #000 45%, transparent 100%); }
.qcard > *:not(svg) { position: relative; }
.chip { align-self: flex-start; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink); background: var(--accent); border-radius: 999px; padding: 5px 10px; }
.qtext { font-size: 20px; font-weight: 700; line-height: 1.3; max-width: 268px; text-wrap: pretty; }
.answers { display: flex; flex-direction: column; gap: 9px; }
.ans { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 14px; padding: 8px 14px; text-align: left; transition: background .15s, border-color .15s, opacity .2s; }
.ans .l { width: 30px; height: 30px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 15px; background: var(--track); }
.ans .tag { margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.ans.off { opacity: .3; text-decoration: line-through; }
.ans.dim { opacity: .45; }
.ans.ok { border: 2px solid var(--accent); background: rgba(169,199,176,.16); box-shadow: 0 0 18px rgba(169,199,176,.3); }
.ans.ok .l { background: var(--accent); color: var(--ink); }
.ans.ok .tag { color: var(--accent); }
.ans.ko { border: 2px solid var(--err); background: rgba(217,150,126,.15); }
.ans.ko .l { background: var(--err); color: var(--ink); }
.ans.ko .tag { color: var(--err); }
.hint { display: flex; gap: 12px; align-items: flex-start; background: rgba(169,199,176,.12); border: 1px solid var(--accent-d); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.4; color: #E4EBE8; }
.aids { margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 4px; }
.aid { background: transparent; border: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.aid .c { width: 64px; height: 64px; border-radius: 999px; background: radial-gradient(circle at 35% 30%, #3E5158, var(--card) 70%); border: 1px solid var(--line3); box-shadow: 0 6px 16px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.aid span.n { font-size: 12px; font-weight: 600; line-height: 1.25; text-align: center; }
.aid:disabled { opacity: .35; }
.panel { margin-top: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; border-radius: 20px; background: var(--card); border: 1px solid var(--line2); box-shadow: 0 -10px 30px rgba(0,0,0,.3); animation: up .3s ease; }
.panel.good { border-top: 3px solid var(--accent); }
.panel.bad { border-top: 3px solid var(--err); }
.fact { display: flex; gap: 10px; background: var(--bg); border-radius: 12px; padding: 12px; font-size: 13px; line-height: 1.45; color: #E4EBE8; }
.pts { display: flex; flex-direction: column; align-items: flex-end; }
.pts b { font-family: var(--display); font-size: 22px; color: var(--accent); }
.pts small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.staff { width: 100%; height: auto; display: block; }
.dots { display: flex; justify-content: space-between; gap: 4px; }
.dots i { width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
.dots i b { width: 6px; height: 6px; border-radius: 999px; }
.exitbar { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 10px 12px; font-size: 13px; }
.exitbar button { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line3); background: transparent; font-size: 13px; font-weight: 600; }
.exitbar button.yes { background: var(--err); color: var(--ink); border: none; }
.timer { width: 44px; height: 44px; flex: none; position: relative; display: flex; align-items: center; justify-content: center; }
.timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer b { position: relative; font-family: var(--display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.timer.low b { color: var(--err); }
.timer.low { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.btn.shine { position: relative; overflow: hidden; border-color: var(--gold); color: var(--gold); font-weight: 700; }
.btn.shine::after, .shinecard::after { content: ""; position: absolute; top: 0; bottom: 0; width: 45%; left: -60%; background: linear-gradient(100deg, transparent, rgba(232,200,116,.35), transparent); animation: sweep 2.6s ease-in-out infinite; pointer-events: none; }
.shinecard { position: relative; overflow: hidden; }
@keyframes sweep { 0% { left: -60%; } 60%, 100% { left: 130%; } }
button.medal { color: var(--fg); font: inherit; }
.medal.fresh { position: relative; border-color: var(--gold); background: linear-gradient(160deg, rgba(232,200,116,.14), var(--card) 60%); }
.medal.fresh b { color: var(--gold); }
.medal .newtag { position: absolute; top: 6px; right: 6px; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--ink); background: var(--gold); border-radius: 999px; padding: 2px 6px; }
.reveal .rbox { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; animation: up .25s ease; }
.reveal .stage { position: relative; width: 240px; height: 210px; display: flex; align-items: center; justify-content: center; }
.reveal .bigmedal { position: relative; z-index: 2; filter: drop-shadow(0 10px 22px rgba(0,0,0,.5)); }
.reveal.fresh .bigmedal { animation: medalout 1.5s cubic-bezier(.2,.8,.2,1) both; animation-delay: .35s; z-index: 1; }
.reveal .sleeve { position: absolute; z-index: 2; animation: sleeveaway 1.3s ease both; animation-delay: .35s; }
.reveal .rtext { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 300px; }
.reveal.fresh .rtext { animation: fade .5s ease both; animation-delay: 1.5s; }
.fnote { position: absolute; bottom: 30px; margin-left: -10px; z-index: 3; font-weight: 700; opacity: 0; animation: noteup 1.7s ease-out both; pointer-events: none; text-shadow: 0 0 10px rgba(232,200,116,.4); }
.reveal.closing { animation: fadeout .3s ease both; }
.reveal.closing .bigmedal { animation: shrink .3s ease both; }
@keyframes medalout { 0% { transform: translateY(10px) scale(.5); opacity: 0; } 25% { transform: translateY(-40px) scale(.55); opacity: 1; } 65% { transform: translateY(-6px) scale(1.12); } 100% { transform: none; opacity: 1; } }
@keyframes sleeveaway { 0%, 25% { transform: none; opacity: 1; } 70% { transform: translateY(70px) rotate(-6deg); opacity: 0; } 100% { transform: translateY(80px); opacity: 0; } }
@keyframes noteup { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-170px) scale(1.1) rotate(12deg); opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes shrink { to { transform: scale(.3); opacity: 0; } }
.sfida { position: relative; overflow: hidden; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 8px; border-color: rgba(232,200,116,.55); background: linear-gradient(160deg, rgba(232,200,116,.10), var(--card) 55%); }
.sfida .btn { height: 46px; }
.btn.gold { background: var(--gold); color: var(--ink); }
.mnote.on { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.45); } }
.switch { width: 46px; height: 28px; border-radius: 999px; background: var(--track); border: 1px solid var(--line2); position: relative; flex: none; transition: background .2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 999px; background: var(--muted); transition: transform .2s, background .2s; }
.switch.on { background: var(--accent-d); border-color: var(--accent); }
.switch.on i { transform: translateX(18px); background: #FFFFFF; }
.ibtn { width: 32px; height: 32px; flex: none; border-radius: 999px; background: rgba(21,29,32,.8); border: 1px solid var(--line3); color: var(--fg); font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.ibtn.sm { width: 26px; height: 26px; font-size: 14px; }
.ibtn.abs { position: absolute; top: 10px; right: 10px; z-index: 3; }
.ibtn.abs.left { left: 10px; right: auto; }
.mwrap { position: relative; min-width: 0; }
.nbadge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--gold); color: var(--ink); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
.mwrap .mode { width: 100%; }
.rules { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.45; color: #E4EBE8; }
.introp { margin: 0; font-size: 15px; line-height: 1.5; color: #E4EBE8; }
.ilist { display: flex; flex-direction: column; gap: 10px; }
.ilist > div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
.ilist b { font-family: var(--display); font-size: 17px; text-transform: uppercase; letter-spacing: .5px; }
.ilist span { font-size: 13px; color: var(--muted); line-height: 1.4; }
.duelcard { width: 100%; min-height: 96px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); padding: 14px 14px 14px 16px; display: flex; align-items: center; gap: 12px; color: var(--fg); }
.duelcard .t { font-family: var(--display); font-weight: 600; font-size: 21px; letter-spacing: .5px; text-transform: uppercase; }
.vsart { position: relative; display: flex; align-items: center; flex: none; margin-right: 30px; }
.vsart b { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--display); font-size: 18px; color: var(--fg); background: var(--bg); border: 1px solid var(--line3); border-radius: 999px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
.avatar { width: 44px; height: 44px; flex: none; border-radius: 999px; background: var(--bg); border: 2px solid var(--accent); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 18px; }
.vsline { display: flex; align-items: center; gap: 10px; color: var(--muted); font-family: var(--display); font-size: 14px; letter-spacing: 2px; }
.vsline::before, .vsline::after { content: ""; flex: 1; height: 1px; background: var(--line2); }
.pill { height: 38px; padding: 0 14px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line3); color: var(--fg); font-size: 14px; font-weight: 600; }
.namelink { background: none; border: none; padding: 0; color: var(--fg); font-weight: 700; text-decoration: underline; text-decoration-color: var(--line3); text-underline-offset: 3px; font-size: inherit; }
.still, .still * { animation: none !important; }
.pstag { align-self: flex-start; display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--gold); color: var(--ink); font-size: 11px; font-weight: 800; letter-spacing: .3px; }
.pstag.abs { position: absolute; top: 12px; right: 12px; z-index: 2; height: 22px; padding: 0 8px; }
.mode > .pstag.abs { position: absolute; }
.radio { width: 18px; height: 18px; flex: none; border-radius: 999px; border: 2px solid var(--line3); }
.radio.on { border-color: var(--accent); box-shadow: inset 0 0 0 4px var(--card); background: var(--accent); }
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)); background: rgba(12,17,19,.72); backdrop-filter: blur(3px); animation: fade .2s ease; }
.modal .box { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line2); border-radius: 22px; padding: 24px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.5); animation: up .25s ease; }
.modal .box p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .panel, .modal, .modal .box, .timer.low, .btn.shine::after, .shinecard::after, .reveal .rbox, .reveal.fresh .bigmedal, .reveal .sleeve, .reveal.fresh .rtext, .reveal.closing, .reveal.closing .bigmedal, .mnote.on { animation: none; } .reveal .sleeve, .fnote { display: none; } .bar > i { transition: none; } }

/* Tema, bacheca, classifica */
.genre { position: relative; overflow: hidden; height: 112px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: left; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
.genre.sel { background: rgba(169,199,176,.16); border: 2px solid var(--accent); }
.genre .rec { position: absolute; top: -18px; right: -18px; width: 76px; height: 76px; border-radius: 999px; background: var(--deep); box-shadow: inset 0 0 0 6px #1B2528, inset 0 0 0 12px var(--deep), inset 0 0 0 13px #2E3C41, inset 0 0 0 20px var(--deep), inset 0 0 0 21px #2E3C41; }
.genre .lab { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--ink); }
.genre .nm { position: relative; font-family: var(--display); font-weight: 600; font-size: 17px; text-transform: uppercase; line-height: 1.1; padding-right: 30px; }
.genre > span.s { position: relative; }
.medal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.medal.lock { opacity: .55; }
.medal b { font-size: 12px; line-height: 1.2; }
.medal small { font-size: 10px; color: var(--muted); line-height: 1.3; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { height: 40px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; }
.seg button.on { background: var(--accent); color: var(--ink); }
.lrow { min-height: 52px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 6px 14px; }
.lrow.me { background: rgba(169,199,176,.14); border-color: var(--accent); }
.lrow .p { width: 22px; font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--muted); }
.lrow .v { font-family: var(--display); font-weight: 600; font-size: 16px; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; min-height: 170px; }
.podium > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.podium .av { border-radius: 999px; background: var(--card); border: 2px solid; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 18px; }
.podium .st { width: 100%; border-radius: 10px 10px 0 0; display: flex; justify-content: center; padding-top: 6px; font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--ink); }
.podium .nm { font-size: 13px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { height: 50px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card); color: var(--fg); padding: 0 14px; font: inherit; font-size: 16px; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5; border: 1px dashed var(--line2); border-radius: 14px; }
.info p { margin: 0; font-size: 14px; line-height: 1.55; color: #E4EBE8; }

/* ---------- Suoni e vibrazione ---------- */
function settings() { DB.settings = DB.settings || { sound: true, vibe: true }; return DB.settings; }
let AC = null;
function ac() {

  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) { AC = null; }
  return AC;
}
function tone(freq, at, dur, opt) {
  const c = ac(); if (!c) return;
  opt = opt || {};
  const t0 = c.currentTime + (at || 0), vol = opt.vol || 0.22;
  const g = c.createGain(); g.connect(c.destination);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  (opt.waves || ["triangle", "sine"]).forEach((w, i) => {
    const o = c.createOscillator(); o.type = w; o.frequency.setValueAtTime(freq * (i === 1 ? 2 : 1), t0);
    if (opt.detune) o.detune.setValueAtTime(opt.detune * (i ? -1 : 1), t0);
    const og = c.createGain(); og.gain.value = i ? 0.25 : 1; o.connect(og); og.connect(g);

const GOAL_PRIZE = 300;

  if (pick.includes(1) && pick.includes(7)) pick = pick.filter(i => i !== 7).concat(idx.find(i => !pick.includes(i) && i !== 7));

  else ws.prog[k] = (ws.prog[k] || 0) + v;
  if (ws.prog[k] >= g.goal) {

}

/* ---------- Domande dal foglio Google pubblicato ---------- */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVls4diXtmoNxpkaeskLQMQK6LlO0xKPae-Anbnz3ufr63fQDJacEjUjBTPrRjWu9ST_jiIEpynjRp/pub?gid=971741918&single=true&output=csv";
const QKEY = "noteingioco.domande";
const MIN_SHEET_Q = 10;
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function sheetToQuestions(text) {
  const rows = parseCSV(text.replace(/^﻿/, ""));
  if (rows.length < 2) return [];
  const norm = s => String(s || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const head = rows[0].map(norm), col = name => head.indexOf(norm(name));
  const C = { id: col("ID"), q: col("Domanda"), ok: col("Risposta giusta"), w1: col("Sbagliata 1"), w2: col("Sbagliata 2"), w3: col("Sbagliata 3"), g: col("Genere"), a: col("Argomento"), d: col("Difficoltà"), h: col("Suggerimento del maestro"), s: col("Lo sapevi?"), v: col("Verificata"), sd: col("Sfida del giorno") };
  if ([C.q, C.ok, C.w1, C.w2, C.w3, C.g, C.d].some(x => x < 0)) return [];
  const cleanAns = v => { const s = String(v || "").trim(); return s.endsWith(".") ? s.slice(0, -1) : s; };
  const day = v => {
    const s = String(v || "").trim(); let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
    if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/))) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    return "";
  };
  const out = [], seen = new Set(); let n = 0;
  for (const r of rows.slice(1)) {
    const get = i => i >= 0 ? String(r[i] || "").trim() : "";
    if (!get(C.q)) continue;
    n++;
    if (C.v >= 0 && !/^s/i.test(get(C.v))) continue;
    const ok = cleanAns(get(C.ok)), w = [cleanAns(get(C.w1)), cleanAns(get(C.w2)), cleanAns(get(C.w3))];
    const d = parseInt(get(C.d), 10);
    if (!ok || w.some(x => !x) || !(d >= 1 && d <= 5)) continue;
    if (new Set([ok, ...w].map(x => x.toLowerCase())).size < 4) continue;
    let id = parseInt(get(C.id), 10); if (!(id > 0) || seen.has(id)) id = n; if (seen.has(id)) continue; seen.add(id);
    const item = { id, q: get(C.q), ok, w, g: get(C.g) || "Varie", a: get(C.a), d, h: get(C.h), s: get(C.s) };
    const sd = day(get(C.sd)); if (sd) item.sd = sd;
    out.push(item);
  }
  return out;
}
function useQuestions(list) { if (Array.isArray(list) && list.length >= MIN_SHEET_Q) { QUESTIONS = list; return true; } return false; }
function loadSheetQuestions() {
  try { const c = JSON.parse(localStorage.getItem(QKEY) || "null"); if (c) useQuestions(c.list); } catch (e) {}
  if (!SHEET_URL || typeof fetch !== "function") return;
  const ctl = typeof AbortController === "function" ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), 10000);
  fetch(SHEET_URL + "&t=" + Date.now(), { cache: "no-store", signal: ctl ? ctl.signal : undefined })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      const list = sheetToQuestions(text);

        try { localStorage.setItem(QKEY, JSON.stringify({ at: Date.now(), list })); } catch (e) {}

  ${tot ? `<div class="grid3"><div class="card" style="padding:12px 8px;display:flex;flex-direction:column;align-items:center;border-radius:14px"><span class="disp tab" style="font-size:24px">${tot}</span><span class="small muted" style="font-size:10px;text-transform:uppercase;letter-spacing:1px">duelli</span></div><div class="card" style="padding:12px 8px;display:flex;flex-direction:column;align-items:center;border-radius:14px"><span class="disp tab" style="font-size:24px;color:var(--accent)">${wins}</span><span class="small muted" style="font-size:10px;text-transform:uppercase;letter-spacing:1px">vinti</span></div><div class="card" style="padding:12px 8px;display:flex;flex-direction:column;align-items:center;border-radius:14px"><span class="disp tab" style="font-size:24px">${rows.length}</span><span class="small muted" style="font-size:10px;text-transform:uppercase;letter-spacing:1px">sfidanti</span></div></div>
  <div class="small muted">I duelli di ${esc(DB.current)}, sfidante per sfidante</div><div style="display:flex;flex-direction:column;gap:8px">${list}</div>`
  : `<div class="empty">Non hai ancora fatto duelli. Sfida un amico sullo stesso telefono e qui vedrai chi è in vantaggio.</div><button class="btn" data-act="go" data-view="duello">Inizia un duello</button>`}
  <button class="btn ghost" style="margin-top:auto" data-act="go" data-view="giocatori">${ICON.people}Cambia giocatore</button>`;
}
function niceDate(s) {
  const today = dayStr(new Date()); const y = new Date(); y.setDate(y.getDate() - 1);
  if (s === today) return "oggi"; if (s === dayStr(y)) return "ieri";
  const [Y, M, D] = s.split("-").map(Number); return D + " " + ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"][M - 1];
}
function vGiocatori() {
  const names = Object.keys(DB.players);
  return `${head("Chi gioca adesso?", "Giocatori")}
  <div style="display:flex;flex-direction:column;gap:8px">${names.map(n => `<button class="lrow ${n === DB.current ? "me" : ""}" style="text-align:left;color:var(--fg)" data-act="pick" data-n="${esc(n)}"><span class="grow" style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:700">${esc(n)}</span><span class="small muted">Liv. ${level(DB.players[n].ascolti)}, ${esc(levelName(level(DB.players[n].ascolti)))} · ${fmt(DB.players[n].ascolti)} ascolti</span></span>${n === DB.current ? '<span class="small" style="color:var(--accent);font-weight:700">In gioco</span>' : ""}</button>`).join("")}</div>
  <form class="field" data-form="newplayer" style="margin-top:6px"><label for="newname" class="small muted" style="font-weight:600">Aggiungi un giocatore o rinomina il tuo</label><input id="newname" name="newname" maxlength="18" autocomplete="off" placeholder="Il tuo nome"><div class="grid2"><button class="btn ghost" type="button" data-act="rename">Rinomina ${esc(DB.current)}</button><button class="btn" type="submit">Aggiungi</button></div></form>`;
}
function vImpostazioni() {
  const st = settings();
  const sw = (k, label, sub) => `<button class="lrow" data-act="toggle" data-k="${k}" role="switch" aria-checked="${st[k] ? "true" : "false"}" style="color:var(--fg);text-align:left;width:100%"><span class="grow" style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:700">${label}</span><span class="small muted">${sub}</span></span><span class="switch ${st[k] ? "on" : ""}"><i></i></span></button>`;
  const lab = s => `<span class="small muted" style="font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-top:6px">${s}</span>`;
  return `${head("Il gioco a modo tuo", "Impostazioni")}
  ${lab("Audio")}
  <div style="display:flex;flex-direction:column;gap:8px">${sw("sound", "Suoni", "Note, accordi e il ticchettio del tempo")}${sw("vibe", "Vibrazione", "Una vibrazione breve a ogni risposta")}</div>
  ${lab("Giocatore")}
  <form class="field" data-form="rename"><label for="renameInput" class="small muted">Il tuo nome</label><div class="row" style="gap:8px"><input id="renameInput" name="renameInput" class="grow" maxlength="18" autocomplete="given-name" value="${esc(DB.current)}" style="min-width:0"><button class="btn" type="submit" style="width:auto;padding:0 18px;height:50px;font-size:15px">Salva</button></div></form>
  <button class="lrow" data-act="go" data-view="giocatori" style="color:var(--fg);text-align:left;width:100%">${ICON.people}<span class="grow" style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:700">Cambia giocatore</span><span class="small muted">${Object.keys(DB.players).length} ${Object.keys(DB.players).length === 1 ? "giocatore" : "giocatori"} su questo telefono</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C5D0CF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  ${lab("Progressi")}
  <button class="lrow" data-act="go" data-view="salvataggio" style="color:var(--fg);text-align:left;width:100%"><span class="grow" style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:700">Salva o carica i progressi</span><span class="small muted">Con un codice, per cambiare telefono</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C5D0CF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  ${lab("Aiuto")}
  <button class="lrow" data-act="intro" style="color:var(--fg);text-align:left;width:100%"><span class="grow" style="font-size:15px;font-weight:700">Rivedi la presentazione</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C5D0CF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  <button class="lrow" data-act="go" data-view="info" style="color:var(--fg);text-align:left;width:100%"><span class="grow" style="font-size:15px;font-weight:700">Informazioni e privacy</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C5D0CF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  ${TEST_MODE ? `${lab("Strumenti di prova")}
  <button class="lrow" data-act="go" data-view="segnalazioni" style="color:var(--fg);text-align:left;width:100%"><span class="grow" style="font-size:15px;font-weight:700">Segnalazioni ricevute</span><span class="small muted">${(DB.reports || []).length}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C5D0CF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="small muted" style="line-height:1.45">Servono solo in questa versione, per vedere dischi e livelli senza giocare per settimane.</div>
  <div class="grid2"><button class="btn ghost" data-act="cheat" data-n="1000">+1.000 ascolti</button><button class="btn ghost" data-act="cheat" data-n="10000">+10.000 ascolti</button></div>` : lab("I tuoi dati")}
  ${S.confirmReset ? `<button class="btn" style="background:var(--err)" data-act="resetyes">Conferma azzeramento</button>` : `<button class="btn ghost" data-act="reset">Azzera i progressi</button>`}`;
}
function vInfo() {
  return `${head(TEST_MODE ? "Versione di prova" : "Versione 1.0", "Informazioni")}
  <div class="info" style="display:flex;flex-direction:column;gap:10px">
    <h2>Privacy</h2>
    <p>Il gioco non richiede registrazione e non mostra pubblicità. Nome, punteggi e medaglie restano salvati solo su questo dispositivo e non vengono inviati a nessuno.</p>${TEST_MODE ? "" : `<p><a href="privacy.html" target="_blank" rel="noopener" style="color:var(--accent)">Leggi l'informativa privacy completa</a></p>`}
    <p>Per domande, segnalazioni o richieste sulla privacy scrivi a <a href="mailto:${CONTACT_EMAIL}" style="color:var(--accent)">${CONTACT_EMAIL}</a>.</p>
    <h2>Musica e marchi</h2>
    <p>Nomi di artisti, titoli di brani e album appartengono ai rispettivi proprietari e sono citati solo come argomento delle domande. Tutte le illustrazioni e i suoni sono originali.</p>
    <h2>Caratteri</h2>
    <p>Oswald e Inter, distribuiti con licenza SIL Open Font License.</p>
  </div>
  <div class="small muted" style="text-align:center;margin-top:auto">${QUESTIONS.length} domande caricate</div>`;
}

/* ---------- Disegno e comandi ---------- */
function render() {
  if (S.view === "home" && !DB.onboarded) { S.view = "intro"; S.introReplay = false; }
  if (S.pendingLevel && !S.levelShow && !S.reveal && ["home", "result", "sfidares", "duelres", "impostazioni", "bacheca", "profilo"].includes(S.view)) { S.levelShow = S.pendingLevel; S.pendingLevel = null; setTimeout(SFX.medal, 200); }
  if (S.goalToast && S.view !== "game") { const m = S.goalToast; S.goalToast = null; setTimeout(() => toast(m), 900); }
  if (S.restUsed) { S.restUsed = false; setTimeout(() => toast("Ieri era il giorno di riposo della band, la tua serie continua"), 300); }
  const v = { segnalazioni: vSegnalazioni, salvataggio: vSalvataggio, chi: vChi, duello: vDuelloSetup, handoff: vHandoff, duelres: vDuelRes, profilo: vProfilo, obiettivi: vObiettivi, intro: vIntro, stonate: vStonate, home: vHome, game: vGame, result: vResult, sfidares: vSfidaRes, ricevuta: vRicevuta, disco: vDisco, tema: vTema, bacheca: vBacheca, classifica: vClassifica, giocatori: vGiocatori, info: vInfo, impostazioni: vImpostazioni }[S.view] || vHome;
  $app.innerHTML = v() + vReveal() + copyModal() + rulesModal() + levelModal() + resumeModal() + whoMenu() + reportModal();
  if (S.levelShow) S.levelAnimated = true;
  if (S.reveal) S.reveal.animated = true;
  const row = document.getElementById("discrow");
  if (row) { const i = Math.max(0, P().discs.length - 1), el = row.children[i]; if (el) row.scrollLeft = Math.max(0, el.offsetLeft - row.offsetLeft - 108); }
}
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act], [data-stop]"); if (!b || b.disabled || b.dataset.stop) return;
  const a = b.dataset.act;
  if (a === "start") { if (b.dataset.mode === "sfida" && (P().daily || {})[dayStr(new Date())]) { toast("Hai già giocato la sfida di oggi"); return; } S.recvPreview = false; history.replaceState && (() => { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} })(); start(b.dataset.mode, b.dataset.mode === "tema" ? S.temaSel : null); }
  else if (a === "go") { S.whoMenu = false; S.view = b.dataset.view; S.confirmReset = false; if (S.view === "bacheca") S.discQueue = []; render(); window.scrollTo(0, 0); }
  else if (a === "home") { S.view = "home"; S.game = null; S.confirmReset = false; render(); window.scrollTo(0, 0); }
  else if (a === "answer") answer(+b.dataset.i);
  else if (a === "aid") useAid(b.dataset.k);
  else if (a === "next") next();
  else if (a === "exit") { S.exitAsk = true; render(); const s = document.getElementById("stayBtn"); if (s) s.focus(); }
  else if (a === "exitno") { S.exitAsk = false; render(); }
  else if (a === "exityes") { if (S.game) S.game.done = true; DB.saved = null; if (S.game && S.game.mode === "sfida") { const p = P(); p.daily[S.game.day] = { res: S.game.results.slice(), done: true }; save(); } S.discQueue = []; S.view = "home"; S.game = null; S.exitAsk = false; render(); }
  else if (a === "restart") { const g = S.game; start(g.mode, g.genre); }
  else if (a === "todisc") goAfterGame("home");
  else if (a === "discnext") { S.discQueue.shift(); S.view = S.discQueue.length ? "disco" : S.after; render(); window.scrollTo(0, 0); if (S.view === "disco") SFX.disc(); else if (S.view === "sfidares") { playMelody(S.game.day, S.game.results); animateMelody(S.game.results); } }
  else if (a === "reveal") { const p = P(); S.reveal = { id: b.dataset.id, fresh: !(p.seen || []).includes(b.dataset.id) }; render(); if (S.reveal.fresh) setTimeout(SFX.medal, 500); }
  else if (a === "replaymel") { const g = S.view === "sfidares" && S.game ? { day: S.game.day, res: S.game.results } : (() => { const s = dayStr(new Date()), d = (P().daily || {})[s]; return { day: s, res: [0, 1, 2, 3, 4].map(k => d.res[k] === true) }; })(); playMelody(g.day, g.res); animateMelody(g.res); }
  else if (a === "share") { const s = S.view === "sfidares" && S.game ? S.game.day : dayStr(new Date()); const res = S.view === "sfidares" && S.game ? S.game.results : [0, 1, 2, 3, 4].map(k => ((P().daily || {})[s] || { res: [] }).res[k] === true); copyText(shareText(s, res)); }
  else if (a === "preview") { const g = S.game; S.recv = { date: g.day, res: g.results.slice() }; S.recvPreview = true; S.view = "ricevuta"; render(); window.scrollTo(0, 0); }
  else if (a === "backres") { S.view = "sfidares"; S.recvPreview = false; render(); }
  else if (a === "playrecv") { playMelody(S.recv.date, S.recv.res); animateMelody(S.recv.res); }
  else if (a === "closecopy") { S.copyFallback = null; render(); }
  else if (a === "rules") { S.rules = b.dataset.m; render(); const c = document.querySelector('.modal [data-act="closerules"].btn'); if (c) c.focus(); }
  else if (a === "closerules") { S.rules = null; render(); }
  else if (a === "closelevel") { S.levelShow = null; S.levelAnimated = false; render(); }
  else if (a === "resume") { resumeGame(); }
  else if (a === "report") { S.report = { id: S.game.q.id }; render(); }
  else if (a === "repreason") { const n = document.getElementById("repNote"); S.report.note = n ? n.value : ""; S.report.reason = +b.dataset.i; render(); }
  else if (a === "sendreport") {
    const r = S.report; if (r.reason === undefined) return;
    const n = document.getElementById("repNote"), q = QUESTIONS.find(x => x.id === r.id);
    DB.reports = (DB.reports || []).concat({ id: r.id, q: q.q, reason: REPORT_REASONS[r.reason], note: (n ? n.value : "").trim(), player: DB.current, date: dayStr(new Date()) }).slice(-200);
    save(); const last = DB.reports[DB.reports.length - 1]; S.report = { id: r.id, sent: true, href: reportMailto(last) }; render();
  }
  else if (a === "closereport") { S.report = null; render(); }
  else if (a === "mailopened") { setTimeout(() => { S.report = null; render(); toast("Grazie per la segnalazione"); }, 400); }
  else if (a === "copyreports") { copyText(document.getElementById("reportsAll").value); }
  else if (a === "makecode") { makeCode().then(c => { S.saveCode = c; render(); }); }
  else if (a === "copycode") { copyText(S.saveCode); }
  else if (a === "loadcode") {
    const v = document.getElementById("loadCode").value; S.loadDraft = v;
    readCode(v).then(d => { S.loadData = d; const names = Object.keys(d.players); S.loadConfirm = { n: names.length, names: names.join(", ") }; render(); })
      .catch(() => toast("Il codice non è valido. Controlla di averlo copiato tutto, dall'inizio QM1 fino alla fine"));
  }
  else if (a === "loadno") { S.loadConfirm = null; S.loadData = null; render(); }
  else if (a === "loadyes") {
    const d = S.loadData; d.onboarded = true; d.saved = null; DB = d; save();
    S.loadConfirm = null; S.loadData = null; S.loadDraft = ""; S.saveCode = null; S.game = null;
    S.view = Object.keys(DB.players).length >= 2 ? "chi" : "home"; render(); window.scrollTo(0, 0); toast("Progressi caricati");
  }
  else if (a === "chi") { DB.current = b.dataset.n; save(); S.view = "home"; render(); window.scrollTo(0, 0); }
  else if (a === "whomenu") { S.whoMenu = true; render(); }
  else if (a === "closewho") { S.whoMenu = false; render(); }
  else if (a === "pickwho") { DB.current = b.dataset.n; S.whoMenu = false; save(); render(); toast("Ora gioca " + DB.current); }
  else if (a === "dropsaved") { dropSaved(); render(); }
  else if (a === "rival") { S.rival = b.dataset.n; const i = document.getElementById("rivalName"); if (i) i.value = S.rival; }
  else if (a === "duelstart") { startDuel(document.getElementById("rivalName").value); }
  else if (a === "duelturn") { const g = S.game; g.duel.turn = 1; g.idx = 0; g.results = []; g.streakRun = 0; g.used = new Set(); g.list = g.list.slice(); setQ(g.list[0]); S.view = "game"; render(); window.scrollTo(0, 0); }
  else if (a === "rematch") { const r = S.game.duel.names[1]; startDuel(r); }
  else if (a === "intronext") { S.introStep = (S.introStep || 0) + 1; render(); window.scrollTo(0, 0); if (S.introStep === 3) setTimeout(() => { const i = document.getElementById("introName"); if (i) i.focus(); }, 50); }
  else if (a === "introback") { S.introStep = Math.max(0, (S.introStep || 0) - 1); render(); }
  else if (a === "introskip") { S.introStep = 3; render(); }
  else if (a === "introdone") { finishIntro(document.getElementById("introName").value); }
  else if (a === "intro") { S.introReplay = true; S.introStep = 0; S.view = "intro"; render(); window.scrollTo(0, 0); }
  else if (a === "introclose") { S.introReplay = false; S.introStep = 0; S.view = "impostazioni"; render(); window.scrollTo(0, 0); }
  else if (a === "toggle") { const st = settings(); st[b.dataset.k] = !st[b.dataset.k]; save(); render(); if (b.dataset.k === "sound" && st.sound) SFX.ok(); if (b.dataset.k === "vibe" && st.vibe) vibe(60); }
  else if (a === "closereveal") {
    if (!S.reveal || S.reveal.closing) return;
    const p = P(); p.seen = p.seen || []; if (!p.seen.includes(S.reveal.id)) p.seen.push(S.reveal.id); save();
    S.reveal.closing = true; render(); setTimeout(() => { S.reveal = null; render(); }, 320);
  }
  else if (a === "genre") { S.temaSel = b.dataset.g; render(); }
  else if (a === "cltab") { S.clTab = +b.dataset.i; render(); }
  else if (a === "pick") { DB.current = b.dataset.n; save(); S.view = "home"; render(); }
  else if (a === "rename") {
    const inp = document.getElementById("newname"); const n = (inp.value || "").trim();
    if (!n) { toast("Scrivi il nuovo nome"); return; }
    if (DB.players[n]) { toast("Questo nome esiste già"); return; }
    const old = DB.current, p = DB.players[old]; p.name = n; DB.players[n] = p; delete DB.players[old];
    DB.history.forEach(h => { if (h.player === old) h.player = n; }); DB.current = n; save(); toast("Nome cambiato in " + n);
  }
  else if (a === "cheat") { addAscolti(+b.dataset.n || 1000); save(); if (S.discQueue.length) { S.after = "impostazioni"; S.view = "disco"; render(); SFX.disc(); } else toast("Ora hai " + fmt(P().ascolti) + " ascolti"); }
  else if (a === "reset") { S.confirmReset = true; render(); }
  else if (a === "resetyes") { DB = { current: "Giocatore 1", players: { "Giocatore 1": blankPlayer("Giocatore 1") }, history: [] }; save(); S.confirmReset = false; S.view = "home"; render(); }
});
$app.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.dataset.form === "duel") { startDuel(document.getElementById("rivalName").value); return; }
  if (e.target.dataset.form === "intro") { finishIntro(document.getElementById("introName").value); return; }
  if (e.target.dataset.form === "rename") {
    const n = (document.getElementById("renameInput").value || "").trim();
    if (!n) { toast("Scrivi un nome"); return; }
    if (n === DB.current) { toast("Il nome è già " + n); return; }
    if (DB.players[n]) { toast("Questo nome esiste già"); return; }
    const old = DB.current, p = DB.players[old]; p.name = n; DB.players[n] = p; delete DB.players[old];
    DB.history.forEach(h => { if (h.player === old) h.player = n; }); DB.current = n; save(); toast("Ora ti chiami " + n); return;
  }
  const n = (document.getElementById("newname").value || "").trim();
  if (!n) { toast("Scrivi un nome"); return; }
  if (!DB.players[n]) DB.players[n] = blankPlayer(n);
  DB.current = n; save(); S.view = "home"; render(); window.scrollTo(0, 0);
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (S.report) { S.report = null; render(); } if (S.whoMenu) { S.whoMenu = false; render(); } if (S.rules) { S.rules = null; render(); } if (S.exitAsk) { S.exitAsk = false; render(); } if (S.reveal && !S.reveal.closing) { const p = P(); p.seen = p.seen || []; if (!p.seen.includes(S.reveal.id)) p.seen.push(S.reveal.id); save(); S.reveal = null; render(); } });
checkSaved();
loadSheetQuestions();
(() => { const r = parseShared(location.hash); if (r) { S.recv = r; S.view = "ricevuta"; } else if (DB.onboarded && Object.keys(DB.players).length >= 2) S.view = "chi"; })();
render();
</script>

<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
